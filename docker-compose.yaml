services:
  hxx:
    image: codex-web:latest
    container_name: hxx-web
    restart: unless-stopped
    working_dir: /app
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["/app/hxx-web"]
    ports:
      - "0.0.0.0:18083:3000"
    volumes:
      - ./hxx-web:/app/hxx-web:ro
      - ./frontend/dist:/app/frontend/dist:ro
      - ./data:/app/data
      - ./hxx.toml:/app/hxx.toml:ro
      - ../codex/workspace:/workspaces
      - ../codex/secrets/app-server-token:/run/secrets/codex-ws-token:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:3000/api/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      app-net:
        aliases:
          - hxx-web.internal

networks:
  app-net:
    external: true
    name: app-net
